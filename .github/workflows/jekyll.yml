name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true # Instala as gems do Gemfile e ativa o cache automaticamente
          cache-version: 0

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Debug TMDB_API_KEY
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "TMDB_API_KEY is NOT set"
          else
            echo "TMDB_API_KEY is set (length: ${#TMDB_API_KEY})"
          fi
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - name: List downloaded images
        run: |
          echo "=== Source images ==="
          ls -la assets/images/movies/ 2>/dev/null || echo "No source images"
          echo "=== _site images ==="
          ls -la _site/assets/images/movies/ 2>/dev/null || echo "No _site images"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
