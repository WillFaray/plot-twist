<footer class="site-footer">
  <div class="container">
    <div>© {{ site.time | date: '%Y' }} Made by Ícaro Barros and William Faray. Movie reviews for the Instrumental
      English class.</div>
    <div style="text-align: right;">
      {%- if site.github_username -%}
      <a href="https://github.com/WillFaray/plot-twist" rel="noopener" target="_blank">GitHub</a>
      {%- endif -%}
      <span class="text-muted"> · Built with Jekyll</span>
      <span class="text-muted"> · </span>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    </div>
  </div>
</footer>

<script>
  const themeToggle = document.getElementById('theme-toggle');
  const html = document.documentElement;
  
  // Load saved theme preference or use system preference
  const savedTheme = localStorage.getItem('theme');
  const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const initialTheme = savedTheme || (systemDark ? 'dark' : 'light');
  
  // Apply initial theme
  if (initialTheme === 'dark') {
    html.setAttribute('data-theme', 'dark');
    themeToggle.textContent = '☀️';
  } else {
    html.removeAttribute('data-theme');
    themeToggle.textContent = '🌙';
  }
  
  // Toggle theme on button click
  themeToggle.addEventListener('click', () => {
    const currentTheme = html.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    
    if (newTheme === 'dark') {
      html.setAttribute('data-theme', 'dark');
      localStorage.setItem('theme', 'dark');
      themeToggle.textContent = '☀️';
    } else {
      html.removeAttribute('data-theme');
      localStorage.setItem('theme', 'light');
      themeToggle.textContent = '🌙';
    }
  });
</script>

<style>
  .theme-toggle {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.2rem;
    padding: 0;
    margin: 0;
    display: inline-block;
    transition: transform 0.2s ease;
  }
  
  .theme-toggle:hover {
    transform: scale(1.2);
  }
  
  .theme-toggle:active {
    transform: scale(0.95);
  }
</style>
