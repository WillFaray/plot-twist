# ============================================================
#  Plot Twist - Movie Reviews
#  Config file for the Jekyll site
# ============================================================

# Site settings
title: Plot Twist
tagline: Movie Reviews for Instrumental English
email: williamfaray@protonmail.com
description: >-
  A personal website for movie reviews, narrative analysis and curated
  watchlists — built for an Instrumental English class.
baseurl: "/plot-twist"
url: "https://williamfaray.github.io/plot-twist/" 
github_username: WillFaray

# Author info
author:
  name: William Faray
  email: williamfaray@protonmail.com

# Common TMDB genre IDs used to build the "Genres" dropdown.
# Reference: https://www.themoviedb.org/talk/5daf6b0ae1733a11e0042f44
genres:
  common:
    - id: 28
      name: Action
    - id: 12
      name: Adventure
    - id: 16
      name: Animation
    - id: 35
      name: Comedy
    - id: 18
      name: Drama
    - id: 14
      name: Fantasy
    - id: 27
      name: Horror
    - id: 10749
      name: Romance
    - id: 878
      name: Science Fiction
    - id: 53
      name: Thriller

# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Theme: we are NOT using the minima gem — we ship our own layouts.
# Removing `theme:` so Jekyll falls back to layouts in _layouts/.

permalink: /:year/:month/:day/:title:output_ext

# Collections (kept default; posts in _posts/)
collections:
  posts:
    output: true
    permalink: /movies/:year/:month/:day/:title/

# Defaults so authors only need to write the minimum front matter
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: movie
      comments: false
      rating: 0

# Sass / SCSS
sass:
  sass_dir: assets/css
  style: compressed

# TMDB API key — used by the build script to fetch metadata.
# Get one at https://www.themoviedb.org/settings/api
# For local builds, set the env var TMDB_API_KEY instead, or fill it in here.
# This file is safe to commit if you only set the env-var fallback.
tmdb:
  api_key: ""                       # <-- put your v3 key here, or use ENV
  image_base: "https://image.tmdb.org/t/p/"
  poster_size: "w500"
  backdrop_size: "w1280"
  language: "en-US"

# Excluded from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - .jekyll-metadata
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - README.md
  - .github/
  - scripts/

include:
  - _pages
