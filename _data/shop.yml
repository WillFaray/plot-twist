# ============================================================
#  Plot Twist - Shop catalogue
# -------------------------------------------------------------
#  A small, curated shelf of film-adjacent things worth owning.
#  Nothing random: restorations, limited prints, vinyl, books
#  and keepsakes that hold their value — and their charm.
#
#  Fields:
#    name      - product title
#    category  - short label shown at the bottom of the tile
#    blurb     - one or two sentences
#    price     - USD number (displayed as-is)
#    badge     - small uppercase chip on the tile (optional)
#    link      - external storefront (target _blank / noopener)
#    featured  - true marks the item with a "✦ pick" chip
#    image     - optional local file under /assets/images/shop/
#                (if omitted, the tile shows the product initials)
# ============================================================

